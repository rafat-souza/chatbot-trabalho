<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob o Bot - Suporte Técnico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Chat</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="info.html">Informações</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <div class="titulo">
            <h1>Bob o Bot</h1>
            <div class="stats-container">
                <div id="tempo-medio">Tempo médio de resposta: -- s</div>
                <div id="taxa-base">Resoluções pela base: --%</div>
            </div>
        </div>

        <div class="caixa-resposta" id="chat-historico">
            <div class="msg-container">
                <img src="img/logo.png" class="bot-avatar" onerror="this.src='https://via.placeholder.com/40'">
                <div class="msg-bot">
                    <strong>Bob:</strong> Olá! Está com algum problema com tecnologia hoje?
                </div>
            </div>
        </div>

        <div class="caixa-pergunta">
            <input type="text" id="pergunta" placeholder="Digite sua dúvida..." onkeypress="if (event.key === 'Enter') enviarMensagem();">
            <button onclick="enviarMensagem()" class="botao">Enviar</button>
        </div>
    </div>

    <script>
        let tempoTotal = 0;
        let qtdRespostas = 0;
        let respostasBase = 0;

        function formatarResposta(texto) {
            if (!texto) return "";
            let html = texto.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            html = html.replace(/\n/g, "<br>");
            return html;
        }

        async function enviarMensagem() {
            const input = document.getElementById("pergunta");
            const chat = document.getElementById("chat-historico");
            const msg = input.value.trim();
            const imgPath = "img/logo.png";

            if (!msg) return;

            chat.innerHTML += `<div class="msg-usuario"><strong>Você:</strong> ${msg}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const idLoad = "loading-" + Date.now();
            chat.innerHTML += `
                    <div class="msg-container" id="${idLoad}">
                        <img src="${imgPath}" class="bot-avatar" onerror="this.src='https://via.placeholder.com/40'">
                        <div class="msg-bot">
                            <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        </div>
                    </div>`;
            chat.scrollTop = chat.scrollHeight;

            const tempoInicio = performance.now();

            try {
                const res = await fetch("http://127.0.0.1:5000/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mensagem: msg }),
                });
                const dados = await res.json();

                const tempoFim = performance.now();
                const duracaoSegundos = (tempoFim - tempoInicio) / 1000;

                tempoTotal += duracaoSegundos;
                qtdRespostas++;

                if (dados.resposta.includes("[Base de Dados Local")) {
                    respostasBase++;
                }

                const mediaAtual = (tempoTotal / qtdRespostas).toFixed(2);
                const taxaBase = ((respostasBase / qtdRespostas) * 100).toFixed(1);

                document.getElementById("tempo-medio").innerText = `Tempo médio de resposta: ${mediaAtual} s`;
                document.getElementById("taxa-base").innerText = `Resoluções pela base: ${taxaBase}%`;

                document.getElementById(idLoad).remove();

                const respostaFormatada = formatarResposta(dados.resposta);

                chat.innerHTML += `
                        <div class="msg-container">
                            <img src="${imgPath}" class="bot-avatar" onerror="this.src='https://via.placeholder.com/40'">
                            <div class="msg-bot"><strong>Bob:</strong><br>${respostaFormatada}</div>
                        </div>`;
            } catch (e) {
                if (document.getElementById(idLoad)) document.getElementById(idLoad).remove();
                chat.innerHTML += `<div class="msg-bot erro"><strong>Erro:</strong> Servidor offline.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
